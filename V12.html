<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~/startpage</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1b1b24; --fg: #d2d7f3; --accent: #e67e22; --lavender: #b69cdb; 
            --dark-gray: #4a4a58; --divider: rgba(182, 156, 219, 0.15);
        }
        [data-theme="mocha"] { --bg: #1e1e2e; --fg: #cdd6f4; --accent: #fab387; --lavender: #cba6f7; --dark-gray: #585b70; }
        [data-theme="dandadan"] { --bg: #2a2529; --fg: #f2c230; --accent: #f24f13; --lavender: #8082a6; --dark-gray: #46334f; }
        [data-theme="matcha"] { --bg: #2b2b2b; --fg: #f5f5f5; --accent: #bad797; --lavender: #670626; --dark-gray: #4a4a4a; }
        [data-theme="space"] { --bg: #222a3f; --fg: #c8b9a1; --accent: #613136; --lavender: #6f7d91; --dark-gray: #3a445c; }

        body {
            background-color: var(--bg); color: var(--fg); font-family: 'JetBrains Mono', monospace;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
            margin: 0; overflow: hidden; transition: background-color 0.4s ease;
        }

        .container { display: flex; gap: 75px; align-items: flex-start; max-width: 1000px; }

        .image-container { position: relative; flex-shrink: 0; }
        .image-container img {
            width: 280px; aspect-ratio: 9 / 16; object-fit: cover;
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .controls-row { 
            position: absolute; bottom: -30px; right: 0; 
            display: flex; gap: 10px; opacity: 0.15; transition: 0.3s;
        }
        .container:hover .controls-row { opacity: 0.6; }

        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 5px; }
        .icon-btn svg { fill: var(--dark-gray); width: 16px; transition: 0.3s; }
        .icon-btn:hover svg { fill: var(--accent); }

        .dropdown-menu {
            position: absolute; bottom: 40px; right: 0; width: 220px;
            background: var(--bg); max-height: 0; overflow-y: auto;
            transition: max-height 0.3s ease; z-index: 100; border-radius: 4px;
            scrollbar-width: thin; scrollbar-color: var(--dark-gray) transparent;
        }
        .dropdown-menu.open { max-height: 280px; border: 1px solid var(--divider); padding: 5px 0; }
        
        /* Fixed: Removed bullets and padding from dropdown lists */
        .dropdown-menu ul { list-style: none; padding: 0; margin: 0; }
        
        .dropdown-menu li {
            font-size: 0.85rem; color: var(--fg); padding: 10px 20px;
            cursor: pointer; border-bottom: 1px solid var(--divider); text-align: right;
        }
        .dropdown-menu li:hover { color: var(--accent); background: rgba(255,255,255,0.04); }

        .content { display: flex; flex-direction: column; margin-top: 45px; }
        h1 { color: var(--accent); font-size: 2.5rem; margin: 0; font-weight: 400; letter-spacing: -1px; }
        .clock { color: var(--lavender); font-size: 1.1rem; margin-top: 8px; margin-bottom: 35px; }

        .search-container { width: 350px; margin-bottom: 40px; }
        .search-bar {
            background: transparent; border: none; border-bottom: 1px solid var(--dark-gray);
            padding: 8px 0; width: 100%; color: var(--fg); font-family: inherit;
            font-size: 1.1rem; outline: none; opacity: 0.8;
        }
        .search-bar:focus { border-bottom: 1px solid var(--accent); opacity: 1; }

        .links-grid { display: grid; grid-template-columns: 160px 160px; gap: 40px; }
        .category h3 { color: var(--lavender); margin: 0 0 15px 0; font-weight: 400; font-size: 1.25rem; }
        .category ul { list-style: none; padding: 0; margin: 0; }
        .category li { margin-bottom: 8px; font-size: 1rem; }
        .category a { color: var(--fg); text-decoration: none; transition: 0.2s; display: inline-block; }
        .category a:hover { color: var(--accent); transform: translateX(5px); }

        .util-section { margin-top: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <img id="slideshow" src="" alt="">
            <div class="controls-row">
                <button class="icon-btn" id="theme-trigger"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></button>
                <button class="icon-btn" id="gallery-trigger"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
            </div>
            <div id="theme-menu" class="dropdown-menu">
                <ul>
                    <li onclick="setTheme('default')">original</li>
                    <li onclick="setTheme('mocha')">catppuccin</li>
                    <li onclick="setTheme('dandadan')">dandadan</li>
                    <li onclick="setTheme('matcha')">cherry matcha</li>
                    <li onclick="setTheme('space')">space cadet</li>
                </ul>
            </div>
            <div id="gallery-menu" class="dropdown-menu"><ul id="gallery-list"></ul></div>
        </div>

        <div class="content">
            <h1 id="greeting">Good morning.</h1>
            <div class="clock" id="clock">00:00:00 | 00/00/0000</div>
            
            <div class="search-container">
                <form onsubmit="handleSearch(event)">
                    <input type="text" id="search-bar" class="search-bar" placeholder="type to search..." autocomplete="off">
                </form>
            </div>

            <div class="links-grid">
                <div class="category">
                    <h3>~/general</h3>
                    <ul>
                        <li><a href="https://youtube.com">YouTube</a></li>
                        <li><a href="https://reddit.com">Reddit</a></li>
                        <li><a href="https://pinterest.com">Pinterest</a></li>
                    </ul>
                </div>
                <div class="category">
                    <h3>~/school</h3>
                    <ul>
                        <li><a href="https://tamo.lt">Tamo Dienynas</a></li>
                        <li><a href="https://office.com">office365</a></li>
                    </ul>
                </div>
            </div>

            <div class="category util-section">
                <h3>~/util</h3>
                <ul>
                    <li><a href="https://spotidownloader.com">spotidownloader</a></li>
                    <li><a href="https://virustotal.com">VirusTotal</a></li>
                    <li><a href="https://proton.me/mail">Proton Mail</a></li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search-bar');
        const images = ["./birddd.png", "./csm.png", "./arima.png", "./sandevistan.png", "./bluebond.png", "./musashi.png", "./vagabond.png", "./vinland.png", "./malenia.png", "./aurafarm.png", "./steamtrain.png", "./csdevil.png", "./infinite.png", "./kurosaki.png", "./touka.png", "./unravel.png", "./giovanna.png", "./silverchariot.png", "./bloom.png", "./slily.png", "./ichigo.png"];
        let currentImgIdx = 0;

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour12: false });
            const date = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
            document.getElementById('clock').innerHTML = `${time} | ${date}`;
            const hrs = now.getHours();
            document.getElementById('greeting').innerText = hrs < 12 ? "Good morning." : hrs < 18 ? "Good afternoon." : hrs < 22 ? "Good evening." : "Late night.";
        }
        setInterval(updateClock, 1000); updateClock();

        function handleSearch(e) {
            e.preventDefault();
            let q = searchInput.value.trim();
            if (!q) return;

            const urlRegex = /^(https?:\/\/)?([\w\d-]+\.)+\w{2,}(\/.*)?$/i;
            if (q.startsWith('y!') || q.startsWith('yt!')) {
                const search = q.includes('!') ? q.split('!')[1].trim() : "";
                window.location.href = search ? `https://www.youtube.com/results?search_query=${encodeURIComponent(search)}` : `https://youtube.com`;
            } else if (urlRegex.test(q)) {
                window.location.href = q.startsWith('http') ? q : `https://${q}`;
            } else {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
            }
        }

        const tMenu = document.getElementById('theme-menu'), gMenu = document.getElementById('gallery-menu');
        function setTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('preferred-theme', t); tMenu.classList.remove('open'); }
        
        document.getElementById('theme-trigger').onclick = (e) => { e.stopPropagation(); tMenu.classList.toggle('open'); gMenu.classList.remove('open'); };
        document.getElementById('gallery-trigger').onclick = (e) => { e.stopPropagation(); gMenu.classList.toggle('open'); tMenu.classList.remove('open'); };

        function setImg(idx, instant = false) {
            currentImgIdx = idx;
            const s = document.getElementById("slideshow");
            if (instant) {
                s.src = images[idx];
            } else {
                s.style.opacity = 0;
                setTimeout(() => { s.src = images[idx]; s.style.opacity = 1; }, 200);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                currentImgIdx = (currentImgIdx + 1) % images.length;
                setImg(currentImgIdx);
            }
            if (e.key === 'Escape') {
                searchInput.value = '';
                tMenu.classList.remove('open'); gMenu.classList.remove('open');
            }
            if (document.activeElement !== searchInput && e.key.length === 1 && !e.ctrlKey && !e.altKey) {
                searchInput.focus();
            }
        });

        window.onclick = () => { tMenu.classList.remove('open'); gMenu.classList.remove('open'); };

        window.onload = () => {
            setTheme(localStorage.getItem('preferred-theme') || 'default');
            const l = document.getElementById('gallery-list');
            images.forEach((img, i) => {
                const li = document.createElement('li');
                li.innerText = img.split('/').pop().split('.')[0];
                li.onclick = (e) => { e.stopPropagation(); setImg(i); gMenu.classList.remove('open'); };
                l.appendChild(li);
            });
            setImg(Math.floor(Math.random() * images.length), true);
            searchInput.focus();
        };
    </script>
</body>
</html>
